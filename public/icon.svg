<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Dark Obsidian Background with subtle border -->
  <rect width="32" height="32" rx="8" fill="#07090E" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="#1E293B" stroke-width="1.5" />

  <!-- Signature Cobalt C -->
  <path
    d="M 12.8 11.2 C 11.8 10.2 10.1 9.8 8.4 11.2 C 6.5 12.8 5.6 15.2 5.6 17 C 5.6 18.8 6.5 21.2 8.4 22.8 C 10.1 24.2 11.8 23.8 12.8 22.8"
    stroke="#0052FF"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Signature Diagonal Laser Slash -->
  <line
    x1="13.5"
    y1="23.5"
    x2="28"
    y2="8.5"
    stroke="#0052FF"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Counter Diagonal Slash in Clean White -->
  <line
    x1="18.5"
    y1="9.5"
    x2="25"
    y2="22.5"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
